ana":"プレシジョン"},{"id":2443,"word":"preservation","meaning":"保存","kana":"プリザベーション"},{"id":2444,"word":"privately","meaning":"個人的に","kana":"プライベートリー"},{"id":2445,"word":"sail","meaning":"航海する","kana":"セイル"},{"id":2446,"word":"salmon","meaning":"サケ（魚）","kana":"サーモン"},{"id":2447,"word":"secretly","meaning":"こっそり","kana":"シークレットリー"},{"id":2448,"word":"seller","meaning":"売り手","kana":"セラー"},{"id":2449,"word":"tan","meaning":"日焼けした肌の色","kana":"タン"},{"id":2450,"word":"visitor","meaning":"訪問者","kana":"ビジター"},{"id":2451,"word":"vitamin","meaning":"ビタミン","kana":"ヴァイタミン"},{"id":2452,"word":"voluntary","meaning":"自発的な","kana":"ボランタリー"},{"id":2453,"word":"whip","meaning":"ムチ","kana":"ウィップ"},{"id":2454,"word":"wrist","meaning":"手首","kana":"リスト"},{"id":2455,"word":"banana","meaning":"バナナ","kana":"バナナ"},{"id":2456,"word":"behave","meaning":"振る舞う","kana":"ビヘイヴ"},{"id":2457,"word":"chin","meaning":"あご","kana":"チン"},{"id":2458,"word":"clerk","meaning":"店員","kana":"クラーク"},{"id":2459,"word":"cottage","meaning":"小さな別荘","kana":"コテッジ"},{"id":2460,"word":"dash","meaning":"急いで走る","kana":"ダッシュ"},{"id":2461,"word":"disposal","meaning":"処分","kana":"ディスポーザル"},{"id":2462,"word":"donation","meaning":"寄付","kana":"ドネーション"},{"id":2463,"word":"drone","meaning":"ドローン（無人機）","kana":"ドローン"},{"id":2464,"word":"escort","meaning":"付き添う","kana":"エスコート"},{"id":2465,"word":"firmly","meaning":"しっかりと","kana":"ファームリー"},{"id":2466,"word":"flour","meaning":"小麦粉","kana":"フラワー"},{"id":2467,"word":"indirect","meaning":"直接でない","kana":"インダイレクト"},{"id":2468,"word":"kindly","meaning":"親切に","kana":"カインドリー"},{"id":2469,"word":"kindness","meaning":"親切さ","kana":"カインドネス"},{"id":2470,"word":"minus","meaning":"マイナス","kana":"マイナス"},{"id":2471,"word":"prescription","meaning":"処方箋","kana":"プリスクリプション"},{"id":2472,"word":"puppy","meaning":"子犬","kana":"パピー"},{"id":2473,"word":"silicon","meaning":"シリコン","kana":"シリコン"},{"id":2474,"word":"slice","meaning":"薄切り","kana":"スライス"},{"id":2475,"word":"spelling","meaning":"綴り","kana":"スペリング"},{"id":2476,"word":"survivor","meaning":"生存者","kana":"サバイバー"},{"id":2477,"word":"telegraph","meaning":"電信（電報）","kana":"テレグラフ"},{"id":2478,"word":"vaccine","meaning":"ワクチン","kana":"ヴァクシーン"},{"id":2479,"word":"vinyl","meaning":"ビニール","kana":"ヴァイナル"}];
    const LETTERS = ['A','B','C','D'];
    const state = {screen:'home', mode:null, start:1, end:100, count:10, questions:[], index:0, score:0, answered:false, selected:null, missed:[], lastRangeLabel:''};
    const app = document.getElementById('app');
    const esc = (v) => String(v).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
    const shuffle = (arr) => [...arr].sort(() => Math.random() - .5);
    const clamp = (n,a,b) => Math.max(a, Math.min(b,n));
    function goHome(){ state.screen='home'; state.questions=[]; render(); window.scrollTo({top:0,behavior:'smooth'}); }
    function selectMode(mode){ state.mode=mode; render(); }
    function choosePreset(start,end,label){ state.start=start; state.end=end; state.lastRangeLabel=label; render(); }
    function validRange(){ state.start=clamp(Number(state.start)||1,1,VOCAB.length); state.end=clamp(Number(state.end)||100,state.start,VOCAB.length); return state.end-state.start+1; }
    function makeQuestionPool(){
      if(state.mode==='range'){ validRange(); return VOCAB.filter(x=>x.id>=state.start&&x.id<=state.end); }
      return VOCAB;
    }
    function startQuiz(){
      const pool=makeQuestionPool(); const requested=state.mode==='range' ? pool.length : clamp(Number(state.count)||10,1,Math.min(pool.length,100));
      const selectedPool=state.mode==='range' ? pool : shuffle(pool).slice(0,requested);
      state.questions=selectedPool.map(answer=>({answer, choices:shuffle([answer,...shuffle(pool.filter(x=>x.id!==answer.id)).slice(0,3)])}));
      state.index=0; state.score=0; state.answered=false; state.selected=null; state.missed=[]; state.screen='quiz'; render(); window.scrollTo({top:0,behavior:'smooth'});
    }
    function answer(choiceId){ if(state.answered)return; state.answered=true; state.selected=choiceId; const q=state.questions[state.index]; if(choiceId===q.answer.id){state.score++}else{state.missed.push(q.answer)} render(); }
    function nextQuestion(){ if(state.index>=state.questions.length-1){state.screen='result';render();window.scrollTo({top:0,behavior:'smooth'});return} state.index++; state.answered=false; state.selected=null; render(); window.scrollTo({top:0,behavior:'smooth'}); }
    function keyAnswer(k){ const idx=LETTERS.indexOf(k.toUpperCase()); if(idx<0||state.answered)return; const btn=document.querySelectorAll('.choice')[idx]; if(btn)btn.click(); }
    function render(){ if(state.screen==='home') renderHome(); else if(state.screen==='quiz') renderQuiz(); else renderResult(); }
    function renderHome(){
      const presets=[]; for(let i=1;i<=VOCAB.length;i+=100){const end=Math.min(i+99,VOCAB.length);presets.push({start:i,end,label:`${i}–${end}`});}
      app.innerHTML=`<section class="screen hero"><div class="hero-copy"><div class="section-label">DAILY WORD PRACTICE / 01</div><h1>今日の語彙を、<br><em>ひとつずつ。</em></h1><p class="lede">2,479語のリストから、4択でテンポよく確認。範囲を決めても、全体からランダムに引いても、答えた瞬間に結果がわかります。</p><div class="actions"><button class="btn btn-primary" onclick="document.getElementById('modes').scrollIntoView({behavior:'smooth'})">テストを選ぶ <span>↘</span></button></div></div><div class="hero-visual"><div class="hero-card"><small>VOCAB / 4</small><strong>答えるたび、<br>記憶に印を。</strong></div></div></section>
      <section id="modes" class="screen setup"><div class="setup-head"><div><div class="section-label">SELECT YOUR SESSION</div><h2>どこから始める？</h2></div><p class="setup-intro">短く区切っても、広く試しても。いまの集中力に合うモードを選びます。</p></div><div class="mode-grid"><button class="mode-card ${state.mode==='range'?'selected':''}" onclick="selectMode('range')"><span class="mode-no">01</span><div class="section-label">RANGE MODE</div><h3>100語ずつ、区切って</h3><p>1–100、101–200のように範囲を選び、その区間の単語を最後まで確かめます。</p><div class="card-foot"><span>範囲を選択</span><span>→</span></div></button><button class="mode-card ${state.mode==='random'?'selected':''}" onclick="selectMode('random')"><span class="mode-no">02</span><div class="section-label">RANDOM MODE</div><h3>全単語から、ランダムに</h3><p>登録された2,479語すべてを母集団に、予想できない順番で出題します。</p><div class="card-foot"><span>全体から抽出</span><span>→</span></div></button></div>${state.mode?renderConfig(presets):''}</section>`;
    }
    function renderConfig(presets){
      if(state.mode==='range') return `<div class="config-panel"><div><h3>出題範囲を決める</h3><p>100語単位の区切り、または番号を直接指定できます。選んだ範囲は全件出題します。</p><div class="range-presets">${presets.map((p,i)=>`<button class="preset ${state.start===p.start&&state.end===p.end?'active':''}" onclick="choosePreset(${p.start},${p.end},'${p.label}')">${p.label}</button>`).join('')}</div><div class="range-controls"><label>番号</label><input class="field" type="number" min="1" max="2479" value="${state.start}" onchange="state.start=this.value;validRange();render()" aria-label="開始番号"><span>—</span><input class="field" type="number" min="1" max="2479" value="${state.end}" onchange="state.end=this.value;validRange();render()" aria-label="終了番号"><span style="font-size:12px;color:rgba(255,255,255,.7)">／ ${validRange()}語</span></div></div><div class="config-side"><button class="btn btn-primary" onclick="startQuiz()">${validRange()}語を始める <span>→</span></button></div></div>`;
      return `<div class="config-panel"><div><h3>全体からランダムに</h3><p>2,479語すべてを母集団にして、毎回ちがう問題順で出題します。</p><div class="range-controls"><label for="random-count">出題数</label><select id="random-count" class="field" onchange="state.count=this.value"><option value="10" ${state.count==10?'selected':''}>10問</option><option value="20" ${state.count==20?'selected':''}>20問</option><option value="50" ${state.count==50?'selected':''}>50問</option><option value="100" ${state.count==100?'selected':''}>100問</option></select></div></div><div class="config-side"><button class="btn btn-primary" onclick="startQuiz()">ランダムで始める <span>→</span></button></div></div>`;
    }
    function renderQuiz(){
      const q=state.questions[state.index]; const pct=((state.index+(state.answered?1:0))/state.questions.length)*100; const correct=state.answered&&state.selected===q.answer.id;
      app.innerHTML=`<section class="screen quiz"><div class="quiz-top"><span>${state.mode==='range'?'RANGE / '+state.start+'–'+state.end:'RANDOM / ALL WORDS'}</span><strong>${String(state.index+1).padStart(2,'0')} <span style="font-weight:400;color:var(--ink-soft)">/ ${String(state.questions.length).padStart(2,'0')}</span></strong></div><div class="progress" aria-label="進捗"><span style="width:${pct}%"></span></div><div class="quiz-grid"><article class="question-card"><div class="q-meta">NO. ${q.answer.id} / MEANING</div><h2>${esc(q.answer.meaning)}</h2><p class="meaning">日本語の意味に合う英単語を選んでください。</p><div class="choices">${q.choices.map((choice,i)=>{let cls='';if(state.answered&&choice.id===q.answer.id)cls='correct';else if(state.answered&&choice.id===state.selected)cls='wrong';return `<button class="choice ${cls}" ${state.answered?'disabled':''} onclick="answer(${choice.id})"><span class="choice-key">${LETTERS[i]}</span><span>${esc(choice.word)}</span></button>`}).join('')}</div><div class="feedback ${state.answered?(correct?'ok':'ng'):''}">${state.answered?(correct?'正解。いい印がつきました。':`正解は ${esc(q.answer.word)}（${esc(q.answer.kana)}）`):'A〜Dキーでも選べます。'}</div><div class="next-row"><button class="btn btn-primary" ${state.answered?'':'disabled'} onclick="nextQuestion()">${state.index===state.questions.length-1?'結果を見る':'次の問題へ'} <span>→</span></button></div></article><aside class="quiz-aside"><span class="aside-label">KEEP THE RHYTHM</span><h3>迷いは、<br>次の一問で<br>ほどく。</h3><p>選択するとすぐに正解が表示されます。<br>急がず、でも止まらず。</p></aside></div></section>`;
    }
    function renderResult(){
      const total=state.questions.length, pct=Math.round(state.score/total*100), message=pct===100?'すべて正解。今日の印は満点です。':pct>=80?'かなり安定しています。もう一周で定着へ。':pct>=60?'いい流れです。間違えた語だけ、もう一度。':'ここからが伸びしろ。短い復習を重ねましょう。';
      app.innerHTML=`<section class="screen result"><div class="result-hero"><div><div class="score-label">SESSION COMPLETE / ${state.mode==='range'?`NO. ${state.start}–${state.end}`:'ALL WORDS RANDOM'}</div><h2>今日の印</h2><div class="score">${state.score}<span>/ ${total}</span></div><p class="result-copy">${message}</p><div class="actions"><button class="btn btn-primary" onclick="startQuiz()">もう一度解く <span>↻</span></button><button class="btn btn-quiet" onclick="goHome()">モード選択へ</button></div></div></div><div class="review"><div class="review-head"><div><div class="section-label">REVIEW / MISSED WORDS</div><h3>復習する単語</h3></div><span style="font-size:12px;color:var(--ink-soft)">${state.missed.length}語</span></div>${state.missed.length?`<div class="review-list">${state.missed.map(x=>`<div class="review-item"><div><div class="review-word">${esc(x.word)}</div><div class="review-meaning">${esc(x.meaning)}</div></div><div class="review-kana">${esc(x.kana)}</div></div>`).join('')}</div>`:'<p class="empty-review">間違えた単語はありません。すべての答えが合っていました。</p>'}</div></section>`;
    }
    document.addEventListener('keydown', e=>{if(state.screen==='quiz'&&['a','b','c','d'].includes(e.key.toLowerCase()))keyAnswer(e.key)});
    render();
  </script>
</body>
